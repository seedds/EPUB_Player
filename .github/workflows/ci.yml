name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Pick a simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/^ *(.+) \([0-9A-F-]+\).*$/\1/')
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "EPUB Player" \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}" \
            -enableAddressSanitizer YES \
            CODE_SIGNING_ALLOWED=NO
